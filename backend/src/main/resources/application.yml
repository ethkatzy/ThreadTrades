spring:
  application:
    name: threadtrades-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threadtrades}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USERNAME:threadtrades}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cookie:
    # false/Lax for local http dev (frontend+backend are both "localhost", so
    # Lax is sent on same-site XHR/fetch fine); set COOKIE_SECURE=true and
    # COOKIE_SAME_SITE=None on Render, where frontend/backend are on different
    # domains (cross-site) and SameSite=None requires Secure. See ROADMAP.md #3.
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  storage:
    # "local" (default, dev-only, see LocalDiskStorageService) or "r2" (see
    # R2StorageService) -- ROADMAP.md #1.
    provider: ${STORAGE_PROVIDER:local}
    local-path: ${STORAGE_LOCAL_PATH:./data/uploads}
    r2:
      bucket: ${R2_BUCKET:}
      endpoint: ${R2_ENDPOINT:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        # health/info stay public (SecurityConfig permitAll()); everything else
        # here (metrics, env) requires ROLE_ADMIN via the /actuator/** matcher.
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: when-authorized
