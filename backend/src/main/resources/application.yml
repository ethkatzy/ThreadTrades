spring:
  application:
    name: threadtrades-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threadtrades}
    username: ${DB_USERNAME:threadtrades}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    local-path: ${STORAGE_LOCAL_PATH:./data/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info
